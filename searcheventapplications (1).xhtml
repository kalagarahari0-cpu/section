<style>
.topAligned {
    vertical-align: top;
}
.centerAligned {
    vertical-align: middle;
     
}
 </style>
 <script>
 	
 	
	function isGridEmpty(src){
	
	 	var gridEmpty = document.getElementById('searchEventApplicationForm:isGridEmpty').value;
	
		if(gridEmpty == 'false'){
		
			if(src != 'FIND_NOW')
				return true;
			//else
			//	document.getElementById('copyDiv').style.visibility = "visible";
				
		} else if(gridEmpty == 'true'){
		
			if(src != 'FIND_NOW')
					return false;
				//else
				//	document.getElementById('copyDiv').style.visibility = "hidden";
		}
		
	
	}
	
	
	function addNewClick(){
	
		alert('To add multiple types for a model, leave  the type blank and press the \'Apply\'  button. To add one new model and type, change the model and/or type and click the \'Apply\'  button in the following Detail Screen.');
		
	}
	
 	function preValidationFindNow(){
 	
 		if(document.getElementById('searchEventApplicationForm:eventName_input').value == ''){
 		
 			alert('Event Name is required');
 			return false;
 		} else 
 			return true;
 	}
 </script>
</h:head>
<h:body>
	<h:form id="searchEventApplicationForm" styleClass="mainForm">
	<script>
 	$( document ).ready(function() {
		 $("#table_div_eventApplicationsTable").keydown(function(event) {
		 
		    if (event.which === 38) {
		        event.preventDefault();
		        up('eventApplicationsTable','searchEventApplicationForm','eventApplicationsTable',8);
		    }

		    if (event.which === 40) {
		        event.preventDefault();
		        down('eventApplicationsTable','searchEventApplicationForm','eventApplicationsTable',8);
		    }
		});
 	});
 	</script>
	<h:inputHidden id="isGridEmpty" value="#{eventApplicationBackingBean.m_bolIsGridEmpty}"/>

	</ui:insert>

				<f:selectItems value="#{eventApplicationBackingBean.m_hmpEventName}" />

			</p:selectOneMenu>	
 
            <h:outputLabel for="designSection" value="Design Section" />

				<f:selectItems value="#{eventApplicationBackingBean.m_hmpProcSection}" />

			</p:selectOneMenu>
			
			<h:outputLabel for="partColor" value="Part Color" />
            <p:selectOneMenu id="partColor" value="#{eventApplicationBackingBean.m_strPartColor}" styleClass="nonEditableDD dd150px" filter="true" filterMatchMode="startsWith" tabindex="4">
				<f:selectItems value="#{eventApplicationBackingBean.m_hmpPartColor}" />

			<h:outputLabel for="model" value="Model" />

			<h:outputLabel for="targetPlant" value="Target Plant" />

			</p:selectOneMenu>
			
			<h:outputLabel for="mtcType" value="MTC Type" />
            <p:selectManyMenu id="mtcType" value="#{eventApplicationBackingBean.m_strMTCType1}" styleClass="nonEditableDD" filter="true" filterMatchMode="startsWith" tabindex="12">

				<p:ajax listener="#{eventApplicationBackingBean.onMTCTypeChange}" process="@form" update=" mtcOption " />
			</p:selectManyMenu>
			
			<h:outputLabel for="suppNo" value="Supplier" />

		        	</p:selectBooleanCheckbox>
				   	<h:outputLabel value="Specific Search" />

	       		<p:commandButton value="Cancel" id="cancelBtn" action="#{eventApplicationBackingBean.cancelSearchEventApplication}" ajax="false" styleClass="searchTableBtn" tabindex="17"/>

					<p:ajax event="keyup" listener="#{eventApplicationBackingBean.onQtyOrRateChange}" global="false"></p:ajax>

<h:panelGroup>

        <f:selectItems value="#{eventApplicationBackingBean.m_hmpDesignSection}" />

    </p:selectOneMenu>

</h:panelGroup>

</h:panelGrid>

        </p:column>-->

	<p:dialog id="partLookup" header="Part Search" widgetVar="partLookup" modal="true" height="500" width="700" resizable="false">
		<h:form id="partLookupDialogForm">
		<script>
		$( document ).ready(function() {
		$("#table_div_partLookupTable").keydown(function(event) {
		 
		    if (event.which === 38) {
		        event.preventDefault();
		        up('partLookupTable');
		    }

		    if (event.which === 40) {
		        event.preventDefault();
		        down('partLookupTable');
		    }
		});
		
		
		});
		</script>
		<h:inputHidden id="m_strPartNumberFieldId" value="#{lookupBean.m_strPartNumberFieldId}" />

		<h:inputHidden id="m_bolEventBased" value="#{lookupBean.m_bolEventBased}" />

			<p:panel id="partLookupPanel" header="Part Search" style="margin-bottom:10px;" >
				<h:panelGrid columns="2" layout="grid" styleClass="searchTable">
					<p:outputLabel for="pLookupEventName" value="Event Name" rendered="#{!empty lookupBean.m_strEventName}" />
					<p:inputText id="pLookupEventName" value="#{lookupBean.m_strEventName}" rendered="#{!empty lookupBean.m_strEventName}" />
					<p:outputLabel for="pLookupRevNo" value="Revision Number" rendered="#{!empty lookupBean.m_decRevNo}" />
					<p:inputText id="pLookupRevNo" value="#{lookupBean.m_intRevNo}" rendered="#{!empty lookupBean.m_decRevNo}" />
					<p:outputLabel for="pLookupPartNo" value="Part Number" />
					<p:inputText id="pLookupPartNo" value="#{lookupBean.m_strPartNo}" />
					<p:outputLabel for="pLookupPartName" value="Part Name" />
					<p:inputText id="pLookupPartName" value="#{lookupBean.m_strPartName}" styleClass="inputBoxBig"/>
				</h:panelGrid>
			</p:panel>
			<h:panelGrid columns="2" layout="grid" style="margin: 0 auto;">
				<p:commandButton value="Find Now" actionListener="#{lookupBean.findParts}" ajax="true" update="partLookupTable , partLookMessages" 
				oncomplete="autoScroll('partLookupDialogForm' , 'partLookupTable' );"/>
				<p:commandButton  value="Clear" actionListener="#{lookupBean.clearPartLookup}" ajax="true" update="partLookupPanel , partLookupTable"/>
			</h:panelGrid>
			<div id="table_div_partLookupTable">	
			<p:dataTable id="partLookupTable" widgetVar="partLookupTable" var="part" value="#{lookupBean.m_partLookupList}" styleClass="bigDataTable"
	    	selectionMode="single" selection="#{lookupBean.m_selectedPartLookupDVO}"  rowKey="#{part.m_strPartNo}" 
	    	rows="100" liveResize="true" paginator="true" paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}" 
			rowsPerPageTemplate="10,50,100" resizableColumns="true" scrollable="true" scrollHeight="235">
	        	<p:ajax event="rowDblselect" listener="#{lookupBean.selectPartFromLookup}" oncomplete="PF('partLookup').hide();"/> 
		        <p:column headerText="Part Number" sortBy="#{part.m_strPartNo}">
		            <h:outputText value="#{part.m_strPartNo}" />
		        </p:column>
		        <p:column headerText="Part Name" sortBy="#{part.m_strPartName}">
		            <h:outputText value="#{part.m_strPartName}" />
		        </p:column>
		        
		  	</p:dataTable>
		  	</div>
			<h:panelGrid columns="2" layout="grid" style="margin: 0 auto;">
				<p:commandButton value="Ok" actionListener="#{lookupBean.selectPartFromLookup}" ajax="true" oncomplete="PF('partLookup').hide();"/>
				<p:commandButton  value="Cancel" ajax="true" onclick="PF('partLookup').hide();"/>
			</h:panelGrid>	
	</h:form>
	</p:dialog>
